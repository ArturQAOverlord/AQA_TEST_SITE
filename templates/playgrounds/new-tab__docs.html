<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Документация · AQA Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='play.css') }}">
</head>
<body>
  <main class="playground">
    <div class="panel stack">
      <h1>Документация</h1>
      <p>Спасибо за покупку! Ваш код активации:</p>
      <p style="font-size: 24px"><code data-testid="activation-code" id="code"></code></p>
      <p class="muted">Вернитесь на вкладку с формой и введите код.</p>
    </div>
  </main>
  <script>
    const code = 'PW-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    try { localStorage.setItem('lab-activation-code', code); } catch {}
    document.getElementById('code').textContent = code;
  </script>
</body>
</html>
