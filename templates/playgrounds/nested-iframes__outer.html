<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='play.css') }}">
</head>
<body style="min-height: 0; background: #fff">
  <div style="padding: 16px" class="stack">
    <b>💳 LabPay</b>
    <iframe title="Ввод карты" id="card" src="{{ url_for('playground_subpage', slug=mission.slug, page='inner') }}"
            style="width:100%; height:90px; border:1px solid #dde2ec; border-radius:8px"></iframe>
    <button class="primary" id="pay">Оплатить 990 ₽</button>
    <p id="msg"></p>
  </div>
  <script>
    document.getElementById('pay').addEventListener('click', e => {
      if (!e.isTrusted) return top.Lab.fail('синтетический клик в платёжном виджете');
      const number = document.getElementById('card').contentDocument.querySelector('input').value.replace(/\s/g, '');
      document.getElementById('msg').textContent = number ? 'Платёж отправлен' : 'Введите номер карты';
      if (number === '4242424242424242') top.Lab.success('Оплата через вложенные фреймы прошла');
      else if (number) top.Lab.fail('неверный номер карты');
    });
  </script>
</body>
</html>
