[pytest]
base_url = http://127.0.0.1:5000
testpaths = exercises
# Чтобы `pytest` (без python -m) находил app.py — иначе conftest падает на import app
pythonpath = .
# Артефакты упавших тестов (скриншот и trace) складываются в test-results/
addopts = --import-mode=importlib --screenshot only-on-failure --tracing retain-on-failure
markers =
    smoke: быстрые проверки самого важного (pytest -m smoke)
    slow: долгие тесты (pytest -m "not slow")
