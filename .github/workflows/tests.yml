name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Reference solutions and guards
        run: pytest tests -n 4 --alluredir=allure-results

      - name: Verify reference solutions (mutants, bug hunts, redesigns, structure)
        run: python verify.py --dir tests --jobs 4

      - name: Upload artifacts of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            allure-results/
          retention-days: 7
